{% extends "base.html" %}
{% block title %}Subir Receta - Inacook{% endblock %}

{% block content %}
<div class="container">
    <h1>Subir nueva receta</h1>

    <form method="POST" enctype="multipart/form-data" id="receta-form">
        {% csrf_token %}
        <h2>Datos de la receta</h2>
        {{ receta_form.as_p }}

        <h2>Ingredientes</h2>
        <div class="ingrediente-form">
            <select id="ingrediente-select">
                {% for ingrediente in ingredientes %}
                <option value="{{ ingrediente.idIngrediente }}" 
                        data-unidad="{{ ingrediente.UnidadMedicion_idUnidadMedicion }}"
                        data-precio="{{ ingrediente.Costo_Unitario }}"
                        data-calidad="{{ ingrediente.Calidad }}">
                    {{ ingrediente.Nombre_Ingrediente }}
                </option>
                {% endfor %}
            </select>

            <input type="number" step="0.01" id="cantidad-input" placeholder="Cantidad">
            <input type="text" id="unidad-input" readonly placeholder="Unidad">
            <button type="button" id="add-ingrediente">Agregar</button>
        </div>

        <table id="ingredientes-table" border="1" style="margin-top:10px;">
            <thead>
                <tr>
                    <th>Ingrediente</th>
                    <th>Cantidad</th>
                    <th>Unidad</th>
                    <th>Acción</th>
                    <th>Precio</th>
                    <th>Calidad</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <input type="hidden" name="ingredientes_json" id="ingredientes-json">
        <br>
        <button type="submit">Subir receta</button>
    </form>
</div>

<script>
const selectIngrediente = document.getElementById('ingrediente-select');
const cantidadInput = document.getElementById('cantidad-input');
const unidadInput = document.getElementById('unidad-input');
const addBtn = document.getElementById('add-ingrediente');
const tableBody = document.querySelector('#ingredientes-table tbody');
const ingredientesJson = document.getElementById('ingredientes-json');

// Actualizar unidad al cambiar ingrediente
function actualizarUnidad() {
    const unidad = selectIngrediente.selectedOptions[0].dataset.unidad || '';
    unidadInput.value = unidad;
}
selectIngrediente.addEventListener('change', actualizarUnidad);
actualizarUnidad();

// Lista interna de ingredientes
let ingredientesLista = [];

// Renderizar tabla
function renderizarTabla() {
    tableBody.innerHTML = '';
    ingredientesLista.forEach((ing, idx) => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${ing.nombre}</td>
            <td>${ing.cantidad}</td>
            <td>${ing.unidad}</td>
            <td><button type="button" data-idx="${idx}">Eliminar</button></td>
            <td>${ing.precio}</td>
            <td>${ing.calidad}</td>
        `;
        tableBody.appendChild(row);

        // Botón eliminar
        row.querySelector('button').addEventListener('click', e => {
            const index = e.target.dataset.idx;
            ingredientesLista.splice(index, 1);
            renderizarTabla();
        });
    });
    ingredientesJson.value = JSON.stringify(ingredientesLista);
}

// Agregar ingrediente a la tabla
addBtn.addEventListener('click', () => {
    const id = selectIngrediente.value;
    const nombre = selectIngrediente.selectedOptions[0].text;
    const cantidad = parseFloat(cantidadInput.value);
    const unidad = unidadInput.value;
    const precio = parseFloat(selectIngrediente.selectedOptions[0].dataset.precio) || 0;
    const calidad = selectIngrediente.selectedOptions[0].dataset.calidad || '';

    if (!id) return alert("Selecciona un ingrediente válido.");
    if (!cantidad || cantidad <= 0) return alert("Ingresa una cantidad válida.");

    ingredientesLista.push({id, nombre, cantidad, unidad, precio, calidad});
    renderizarTabla();
    cantidadInput.value = '';
});
</script>
{% endblock %}
