{% extends "base.html" %}
{% block title %}Editar Receta - Inacook{% endblock %}

{% block content %}
<div class="container">
    <h1>Editar Receta: {{ receta.Nombre_Receta }}</h1>

    <form method="POST" enctype="multipart/form-data" id="receta-form">
        {% csrf_token %}
        <h2>Datos de la receta</h2>
        {{ receta_form.as_p }}

        <h2>Ingredientes</h2>

        <div class="ingrediente-form">
            <select id="ingrediente-select">
                {% for ingrediente in ingredientes %}
                <option value="{{ ingrediente.IdIngrediente }}" 
                        data-unidad="{{ ingrediente.UnidadMedicion_idUnidadMedicion.Abreviatura }}">
                    {{ ingrediente.Nombre_Ingrediente }}
                </option>
                {% endfor %}
            </select>

            <input type="number" step="0.01" id="cantidad-input" placeholder="Cantidad">

            <!-- Select de unidad -->
            <select id="unidad-select">
                {% for unidad in unidades %}
                <option value="{{ unidad.Abreviatura }}">{{ unidad.Abreviatura }}</option>
                {% endfor %}
            </select>

            <button type="button" id="add-ingrediente">Agregar</button>
        </div>

        <table id="ingredientes-table" border="1" style="margin-top:10px;">
            <thead>
                <tr>
                    <th>Ingrediente</th>
                    <th>Cantidad</th>
                    <th>Unidad</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <input type="hidden" name="ingredientes_json" id="ingredientes-json">
        <br>
        <button type="submit">Guardar cambios</button>
    </form>
        <a href="{% url 'ver_recetas' %}" class="btn">Cancelar</a>
    </form>
</div>

<script>
const selectIngrediente = document.getElementById('ingrediente-select');
const cantidadInput = document.getElementById('cantidad-input');
const unidadSelect = document.getElementById('unidad-select');
const addBtn = document.getElementById('add-ingrediente');
const tableBody = document.querySelector('#ingredientes-table tbody');
const ingredientesJson = document.getElementById('ingredientes-json');

// Mapa de todos los ingredientes con su unidad por defecto
const ingredientesData = {};
{% for ingrediente in ingredientes %}
ingredientesData["{{ ingrediente.IdIngrediente }}"] = {
    nombre: "{{ ingrediente.Nombre_Ingrediente }}",
    unidad: "{{ ingrediente.UnidadMedicion_idUnidadMedicion.Abreviatura }}"
};
{% endfor %}

// Lista de todas las unidades disponibles
const unidadesData = [
    {% for unidad in unidades %}
    "{{ unidad.Abreviatura }}",
    {% endfor %}
];

// Actualizar unidad al cambiar ingrediente principal
function actualizarUnidad() {
    const unidadDefault = selectIngrediente.selectedOptions[0].dataset.unidad || '';
    unidadSelect.value = unidadDefault;
}
selectIngrediente.addEventListener('change', actualizarUnidad);
actualizarUnidad();

// Lista interna de ingredientes
let ingredientesLista = [];

// Cargar ingredientes existentes al inicio
{% for ri in receta_ingredientes %}
ingredientesLista.push({
    id: "{{ ri.Ingrediente_IdIngrediente.IdIngrediente }}",
    cantidad: {{ ri.Cantidad }},
    unidad: "{{ ri.Ingrediente_IdIngrediente.UnidadMedicion_idUnidadMedicion.Abreviatura }}"
});
{% endfor %}

// Renderizar tabla con selects y cantidad editable
function renderizarTabla() {
    tableBody.innerHTML = '';
    ingredientesLista.forEach((ing, idx) => {
        const row = document.createElement('tr');

        // Select de ingrediente
        let selectHtml = `<select data-idx="${idx}" class="select-ingrediente">`;
        for (const id in ingredientesData) {
            const selected = id == ing.id ? 'selected' : '';
            selectHtml += `<option value="${id}" ${selected}>${ingredientesData[id].nombre}</option>`;
        }
        selectHtml += '</select>';

        // Select de unidad
        let selectUnidadHtml = `<select data-idx="${idx}" class="select-unidad">`;
        unidadesData.forEach(u => {
            const selected = u === ing.unidad ? 'selected' : '';
            selectUnidadHtml += `<option value="${u}" ${selected}>${u}</option>`;
        });
        selectUnidadHtml += '</select>';

        row.innerHTML = `
            <td>${selectHtml}</td>
            <td><input type="number" step="0.01" value="${ing.cantidad}" data-idx="${idx}" class="cantidad-edit" style="width:60px;"></td>
            <td>${selectUnidadHtml}</td>
            <td><button type="button" data-idx="${idx}">Eliminar</button></td>
        `;

        tableBody.appendChild(row);

        // Cambiar cantidad
        row.querySelector('.cantidad-edit').addEventListener('change', e => {
            const index = e.target.dataset.idx;
            const value = parseFloat(e.target.value);
            if (!isNaN(value) && value > 0) {
                ingredientesLista[index].cantidad = value;
            } else {
                e.target.value = ingredientesLista[index].cantidad;
                alert("Cantidad inválida");
            }
            actualizarJSON();
        });

        // Cambiar ingrediente
        row.querySelector('.select-ingrediente').addEventListener('change', e => {
            const index = e.target.dataset.idx;
            const nuevoId = e.target.value;
            ingredientesLista[index].id = nuevoId;
            // Actualizar unidad solo si es la unidad anterior del ingrediente
            if (!ingredientesLista[index].unidad || ingredientesLista[index].unidad === ing.unidad) {
                ingredientesLista[index].unidad = ingredientesData[nuevoId].unidad;
                row.querySelector('.select-unidad').value = ingredientesData[nuevoId].unidad;
            }
            actualizarJSON();
        });

        // Cambiar unidad
        row.querySelector('.select-unidad').addEventListener('change', e => {
            const index = e.target.dataset.idx;
            ingredientesLista[index].unidad = e.target.value;
            actualizarJSON();
        });

        // Eliminar ingrediente
        row.querySelector('button').addEventListener('click', e => {
            const index = e.target.dataset.idx;
            ingredientesLista.splice(index, 1);
            renderizarTabla();
        });
    });

    actualizarJSON();
}

// Actualizar campo oculto
function actualizarJSON() {
    ingredientesJson.value = JSON.stringify(ingredientesLista);
}

// Agregar ingrediente nuevo
addBtn.addEventListener('click', () => {
    const id = selectIngrediente.value;
    const cantidad = parseFloat(cantidadInput.value);
    const unidad = unidadSelect.value;

    if (!id) return alert("Selecciona un ingrediente válido.");
    if (!cantidad || cantidad <= 0) return alert("Ingresa una cantidad válida.");

    if (ingredientesLista.find(ing => ing.id === id)) {
        alert("Ingrediente ya agregado, modifica la cantidad o unidad en la tabla.");
        return;
    }

    ingredientesLista.push({id, cantidad, unidad});
    renderizarTabla();
    cantidadInput.value = '';
});

// Inicializar tabla
renderizarTabla();
</script>

{% endblock %}
